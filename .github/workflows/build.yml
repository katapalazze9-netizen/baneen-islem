name: Build Android AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli
      - name: Init Bubblewrap
        run: bubblewrap init --manifest https://katapalazze9-netizen.github.io/baneen-islem/manifest.json --directory ./android
      - name: Build AAB
        run: |
          cd android
          bubblewrap build
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: App-Bundle
          path: android/app-release-bundle.aab
